# Draft recipe for fdroiddata (metadata/dev.margani.ghest.yml).
# `fdroid lint` and `fdroid scanner` pass. Reproducible: a local build of the tag matches
# the signed GitHub release (apksigcopier compare), so Binaries/AllowedAPKSigningKeys are set.
# The output of `cap sync` is committed, so only Debian's nodejs/npm are needed (no Capacitor CLI).

Categories:
  - Finance Manager
License: GPL-3.0-only
AuthorName: margani
WebSite: https://ghest.margani.dev
SourceCode: https://github.com/margani/ghest
IssueTracker: https://github.com/margani/ghest/issues
Changelog: https://github.com/margani/ghest/releases

AutoName: Ghest

RepoType: git
Repo: https://github.com/margani/ghest.git
Binaries: https://github.com/margani/ghest/releases/download/v%v/ghest-%v.apk

Builds:
  - versionName: 1.0.5
    versionCode: 6
    commit: 6d9f9e81b19c3c65c057c3bf5e5deae50ce7bc81
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init: cd ../.. && npm ci --ignore-scripts
    gradle:
      - yes
    scanignore:
      - node_modules

AllowedAPKSigningKeys: 6c52a1c4c46fe3767cd3f09b89749d91602527d23f19c941d936677ed6cef5f0

MaintainerNotes: |-
  Capacitor app (plain HTML/JS in www/, no bundler). The output of `cap sync`
  (web assets copy, plugin module, configs) is committed, so the build needs
  no Capacitor CLI; Debian's nodejs/npm only install the Capacitor Android
  sources into node_modules. Upstream CI fails if the committed copy drifts.
  Reproducible: Binaries points at the GitHub release built by CI.

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.5
CurrentVersionCode: 6
