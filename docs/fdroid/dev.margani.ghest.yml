# Draft recipe for fdroiddata (metadata/dev.margani.ghest.yml). Not yet verified with `fdroid build`.
Categories:
  - Finance Manager
License: GPL-3.0-only
SourceCode: https://github.com/margani/ghest
IssueTracker: https://github.com/margani/ghest/issues
Changelog: https://github.com/margani/ghest/releases

AutoName: Ghest

RepoType: git
Repo: https://github.com/margani/ghest.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init: cd ../.. && npm ci --ignore-scripts
    gradle:
      - yes
    prebuild: cd ../.. && npm run vendor && npx cap sync android
    scanignore:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
